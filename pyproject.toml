[project]
name = "trainlab"
version = "1.0.0"
description = "Local web UI for configuring, launching and comparing PyTorch image-classification experiments"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "timm>=1.0.20,<2",
  "lightly>=1.5.20,<2",
  "torchmetrics>=1.6,<2",
  "numpy>=1.26",
  "pillow>=10.3",
  "pydantic>=2.9,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pyyaml>=6.0",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1",
  "mlflow>=3.0,<4",
  "optuna>=4.0,<5",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "psutil>=6.0",
]

[project.optional-dependencies]
hf = ["datasets>=3.0"]
postgres = ["psycopg2-binary", "boto3"]
dev = ["pytest>=8.3"]

[project.scripts]
trainlab-train = "train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trainlab", "trainlab.tracking", "backend", "backend.app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
